[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.13.0"
shadow = "9.6.1"
caffeine = "2.9.3" # 3.x requires Java 11; common targets Java 8 (Forge 1.16.5)
evalex = "2.7"
boosted-yaml = "1.3.8"
junit = "5.13.4"
mockito = "5.24.0" # 5.x requires Java 11; the Bukkit, Sponge and BungeeCord tests run on Java 8
minotaur = "2.10.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
evalex = { module = "com.udojava:EvalEx", version.ref = "evalex" }
boosted-yaml = { module = "dev.dejvokep:boosted-yaml", version.ref = "boosted-yaml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# Platform APIs (compileOnly)
spigot-api = { module = "org.spigotmc:spigot-api", version = "1.16.5-R0.1-SNAPSHOT" }
velocity-api = { module = "com.velocitypowered:velocity-api", version = "3.4.0" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version = "1.21-R0.3" }
sponge-api = { module = "org.spongepowered:spongeapi", version = "8.2.0" }

# build-logic plugin artifacts
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
minotaur-gradle-plugin = { module = "com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin", version.ref = "minotaur" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
