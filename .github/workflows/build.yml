name: Build

# Builds and verifies every commit and pull request: the JVM projects (plugins, proxies, mods, lib/jvm), the Go
# modules (lib/go, caddy) and lib/js. A successful push build on devel is published as the `snapshot` pre-release by
# snapshot.yml.

on:
  push:
    # branches only, so the `snapshot` tag that snapshot.yml moves doesn't trigger a build
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # superseded PR builds are cancelled; every pushed commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  jvm:
    name: JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8.*
          key: temurin-jdk8-${{ runner.os }}-${{ runner.arch }}-8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Gradle runs on 25 (Stonecutter); the rest are toolchains for the targets
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -x :lib:go:build -x :caddy:build
      - name: Modrinth dry run
        # builds every Modrinth request (version, loaders, game versions) without uploading, so metadata
        # problems show up here rather than during a release
        run: ./gradlew modrinth -Pmodrinth.debug=true
      - uses: actions/upload-artifact@v7
        with:
          name: minecraft
          if-no-files-found: error
          path: |
            minecraft/plugin/*/build/libs/MinecraftAuth-*.jar
            minecraft/proxy/*/build/libs/MinecraftAuth-*.jar
            minecraft/mod/build/libs/*.jar

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8.*
          key: temurin-jdk8-${{ runner.os }}-${{ runner.arch }}-8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, vet and test (with -race)
        run: ./gradlew :lib:go:build :caddy:build -Pmcauth.go.race=true -Pmcauth.mods=false

  js:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lib/js/package-lock.json
      - uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8.*
          key: temurin-jdk8-${{ runner.os }}-${{ runner.arch }}-8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install, typecheck, test and build
        run: ./gradlew :lib:js:build -Pmcauth.mods=false
      - name: Check the package contents
        working-directory: lib/js
        run: npm pack --dry-run
