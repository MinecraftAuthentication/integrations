name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove your server token, application secret and session key from anything you paste.**
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Bukkit / Spigot / Paper / Folia plugin
        - Sponge plugin
        - Velocity proxy plugin
        - BungeeCord proxy plugin
        - Fabric mod
        - Forge mod
        - NeoForge mod
        - Caddy module
        - lib/jvm (me.minecraftauth:lib)
        - lib/go
        - lib/js (@minecraftauth/lib)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The integration's version (`/mcauth` shows it), or the library/module version.
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: Server software and Minecraft version, Caddy version, or JVM/Go/Node version.
      placeholder: Paper 1.21.1 build 132, Java 21
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `MinecraftAuth.yml` or Caddyfile, with secrets removed.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant console or Caddy log lines, including any stack trace.
      render: text
