version: 2

registries:
  sponge:
    type: maven-repository
    url: https://repo.spongepowered.org/repository/maven-public/
  architectury:
    type: maven-repository
    url: https://maven.architectury.dev/

updates:
  # Gradle: the version catalog (gradle/libs.versions.toml), build-logic and the wrapper.
  # Mod target versions in minecraft/mod/versions/*/gradle.properties are updated by hand.
  - package-ecosystem: gradle
    directory: /
    target-branch: devel
    registries: [sponge, architectury]
    schedule:
      interval: weekly
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      junit:
        patterns: ["org.junit*"]
    ignore:
      # 3.x requires Java 11; minecraft/common targets Java 8 (Forge 1.16.5)
      - dependency-name: com.github.ben-manes.caffeine:caffeine
        update-types: ["version-update:semver-major"]
      # Compiled against the oldest supported platform versions on purpose
      - dependency-name: org.spigotmc:spigot-api
      - dependency-name: com.velocitypowered:velocity-api
      - dependency-name: net.md-5:bungeecord-api
      - dependency-name: org.spongepowered:spongeapi

  - package-ecosystem: gomod
    directories: [/lib/go, /caddy]
    target-branch: devel
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      # Kept in step by hand when releasing (see RELEASING.md)
      - dependency-name: github.com/MinecraftAuthentication/integrations/lib/go

  - package-ecosystem: npm
    directory: /lib/js
    target-branch: devel
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
    ignore:
      # Matches the oldest supported Node (engines >= 22), so code can't use APIs that Node 22 lacks
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: devel
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
