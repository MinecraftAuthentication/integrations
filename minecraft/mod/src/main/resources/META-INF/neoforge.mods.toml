modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/MinecraftAuthentication/integrations/issues"

[[mods]]
modId = "minecraftauth"
version = "${version}"
displayName = "MinecraftAuth"
displayURL = "https://minecraftauth.me"
authors = "MinecraftAuth.me"
description = "Only let players in who follow, subscribe to or support you on Twitch, YouTube, Patreon or Discord."
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "minecraftauth.mixins.json"

[[dependencies.minecraftauth]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "SERVER"
