org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

group=me.minecraftauth
# The one version of everything in this repository: lib/jvm, lib/go, lib/js, caddy and every Minecraft integration.
# A release tags vX.Y.Z and only publishes the components that changed since the previous release
# (scripts/changed-components.sh, RELEASING.md). Change it with `./gradlew setVersion -PnewVersion=X.Y.Z`, which
# also updates lib/js/package.json.
version=2.2.1-SNAPSHOT
# Modrinth project (slug or ID) that `./gradlew modrinth` publishes every plugin, proxy and mod jar to
modrinth_project=minecraft-authentication
